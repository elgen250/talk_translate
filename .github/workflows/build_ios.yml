name: Build iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (without codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA (Payload creation)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r talk_translate.ipa Payload
          rm -rf Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talk-translate-ios-ipa
          path: talk_translate.ipa
          retention-days: 14

